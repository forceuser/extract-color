<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/extract-color/favicon.svg" />
		<link
			rel="stylesheet"
			href="/extract-color/styles.css" />
		<title>Color Alpha Extractor</title>
	</head>
	<body>
		<div class="container">
			<header>
				<div class="theme-switcher">
					<button
						class="theme-btn"
						data-theme="light"
						title="Light Mode">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<circle
								cx="12"
								cy="12"
								r="5"></circle>
							<line
								x1="12"
								y1="1"
								x2="12"
								y2="3"></line>
							<line
								x1="12"
								y1="21"
								x2="12"
								y2="23"></line>
							<line
								x1="4.22"
								y1="4.22"
								x2="5.64"
								y2="5.64"></line>
							<line
								x1="18.36"
								y1="18.36"
								x2="19.78"
								y2="19.78"></line>
							<line
								x1="1"
								y1="12"
								x2="3"
								y2="12"></line>
							<line
								x1="21"
								y1="12"
								x2="23"
								y2="12"></line>
							<line
								x1="4.22"
								y1="19.78"
								x2="5.64"
								y2="18.36"></line>
							<line
								x1="18.36"
								y1="5.64"
								x2="19.78"
								y2="4.22"></line>
						</svg>
					</button>
					<button
						class="theme-btn active"
						data-theme="auto"
						title="System Theme">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<rect
								x="2"
								y="3"
								width="20"
								height="14"
								rx="2"
								ry="2"></rect>
							<line
								x1="8"
								y1="21"
								x2="16"
								y2="21"></line>
							<line
								x1="12"
								y1="17"
								x2="12"
								y2="21"></line>
						</svg>
					</button>
					<button
						class="theme-btn"
						data-theme="dark"
						title="Dark Mode">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
						</svg>
					</button>
				</div>
				<h1>Color Alpha Extractor</h1>
				<p>
					Calculate the exact semi-transparent base color needed to achieve your target
					visual result on any specific background.
				</p>
			</header>

			<div class="panel controls-grid">
				<!-- Inputs Column -->
				<div>
					<div class="form-group">
						<label>1. Target Result (The color you want to see)</label>
						<div class="input-group">
							<div class="color-swatch-wrapper">
								<input
									type="color"
									id="result-color-picker"
									value="#3b82f6" />
							</div>
							<input
								type="text"
								id="result-color-hex"
								value="#3b82f6"
								spellcheck="false" />
							<button
								class="icon-btn"
								id="eyedropper-result"
								title="Pick from screen">
								<svg
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round">
									<path d="m2 22 1-1h3l9-9" />
									<path d="M3 21v-3l9-9" />
									<path
										d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z" />
								</svg>
							</button>
						</div>
					</div>

					<div class="form-group">
						<label>2. Original Background (What it sits on)</label>
						<div class="input-group">
							<div class="color-swatch-wrapper">
								<input
									type="color"
									id="bg-color-picker"
									value="#ffffff" />
							</div>
							<input
								type="text"
								id="bg-color-hex"
								value="#ffffff"
								spellcheck="false" />
							<button
								class="icon-btn"
								id="eyedropper-bg"
								title="Pick from screen">
								<svg
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round">
									<path d="m2 22 1-1h3l9-9" />
									<path d="M3 21v-3l9-9" />
									<path
										d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z" />
								</svg>
							</button>
						</div>
					</div>

					<div
						class="form-group"
						style="margin-bottom: 0">
						<label>Output CSS Format</label>
						<select id="output-format">
							<option value="hexa">HEXA Code (#RRGGBBAA)</option>
							<option value="rgba">RGBA Function (rgba(r, g, b, a))</option>
							<option value="color-mix">CSS color-mix()</option>
							<option value="mixed">Mixed Solid Color (HEX)</option>
						</select>
					</div>
				</div>

				<!-- Image Picker Column -->
				<div class="image-picker-section">
					<label
						style="
							font-size: 0.875rem;
							font-weight: 500;
							color: var(--text-muted);
							margin-bottom: -0.5rem;
						"
						>Pick from Image (Optional)</label
					>

					<input
						type="file"
						id="image-upload"
						accept="image/*"
						style="display: none" />

					<div
						class="dropzone"
						id="dropzone-area"
						onclick="document.getElementById('image-upload').click()">
						<div
							class="dropzone-content"
							id="dropzone-content">
							<svg
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round">
								<rect
									x="3"
									y="3"
									width="18"
									height="18"
									rx="2"
									ry="2" />
								<circle
									cx="8.5"
									cy="8.5"
									r="1.5" />
								<polyline points="21 15 16 10 5 21" />
							</svg>
							<div>Click to upload image</div>
						</div>

						<div id="canvas-container">
							<canvas id="image-canvas"></canvas>
						</div>
					</div>

					<div style="display: flex; gap: 0.5rem">
						<div
							class="picker-mode"
							id="picker-mode"
							style="display: none; flex: 1">
							<label
								><input
									type="radio"
									name="pick-target"
									value="result"
									checked />
								Pick Result</label
							>
							<label
								><input
									type="radio"
									name="pick-target"
									value="bg" />
								Pick BG</label
							>
						</div>
						<button
							class="btn"
							id="clear-image"
							style="display: none"
							title="Clear Image">
							<svg
								width="18"
								height="18"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round">
								<line
									x1="18"
									y1="6"
									x2="6"
									y2="18"></line>
								<line
									x1="6"
									y1="6"
									x2="18"
									y2="18"></line>
							</svg>
						</button>
					</div>
				</div>
			</div>

			<div class="panel">
				<div class="table-controls">
					<div
						class="form-group"
						style="margin-bottom: 0; flex: 1; max-width: 320px">
						<label>Add Preview Background</label>
						<div class="input-group">
							<div class="color-swatch-wrapper">
								<input
									type="color"
									id="new-col-picker"
									value="#1a1a1e" />
							</div>
							<input
								type="text"
								id="new-col-hex"
								value="#1a1a1e"
								spellcheck="false" />
							<button
								class="icon-btn"
								id="add-col-btn"
								title="Add Column"
								style="color: var(--accent)">
								<svg
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round">
									<line
										x1="12"
										y1="5"
										x2="12"
										y2="19"></line>
									<line
										x1="5"
										y1="12"
										x2="19"
										y2="12"></line>
								</svg>
							</button>
						</div>
					</div>
					<div class="hide-invalid-checkbox">
						<input
							type="checkbox"
							id="hide-invalid-checkbox"
							checked />
						<label for="hide-invalid-checkbox">Hide invalid rows</label>
					</div>
				</div>

				<div class="table-container">
					<table id="results-table">
						<thead>
							<tr id="table-head-row">
								<!-- Populated by JS -->
							</tr>
						</thead>
						<tbody id="table-body">
							<!-- Populated by JS -->
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<div id="toast">
			<svg
				width="18"
				height="18"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round">
				<polyline points="20 6 9 17 4 12"></polyline>
			</svg>
			Copied to clipboard!
		</div>

		<script
			type="module"
			src="/extract-color/app.js"></script>
	</body>
</html>
